<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Hover + Scrollbar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      background: radial-gradient(circle at top left, #355C7D, #6C5B7B, #C06C84);
      font-family: "Poppins", sans-serif;
    }

    /* Scrollable horizontal section */
    .main {
      height: 100%;
      width: 100%;
      padding: 25px;
      display: flex;
      gap: 20px;
      
      overflow: auto; /* scroll bar dikhayedega */
      position: relative;
      align-items: center;
    }

    /* Box styling */
    .box {
      height: 300px;
      width: 250px;
      background-color: white;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;


      flex-shrink: 0;
    }

    .box img {
      height: 100%;
      width: 100%;
      object-fit: cover;
      border-radius: 10px;
      transition: transform 0.6s ease;
    }

    /* Hover zoom + shadow */
    .box:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 25px rgba(0, 0, 0, 0.4);
    }
    .box:hover img {
      transform: scale(1.1);
    }

    /* Text + shadow overlay section */
    .bottom {
      position: absolute;
      bottom: -50%;
      left: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
      color: white;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transition: all 0.5s ease;  /*hover krne me kitne smoothly badlega */
      padding-bottom: 20px;
      
    }

    .bottom h3 {
      font-size: 18px;
      transform: translateY(30px);
      transition: transform 0.4s ease, opacity 0.4s ease;
     
    }

    /* Hover animation for text & overlay */
    .box:hover .bottom {
      bottom: 0;
    
    }
    .box:hover .bottom h3 {
      transform: translateY(0);
   
    }

    /* BEAUTIFUL SCROLLBAR */
    .main::-webkit-scrollbar {
      height: 12px;
    }

    .main::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    .main::-webkit-scrollbar-thumb {
      background: linear-gradient(90deg, #a64bf4, #cc2b5e);
      border-radius: 20px;
      transition: all 0.3s ease;
    }

    .main::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(90deg, #ff9966, #ff5e62);
      box-shadow: 0 0 10px rgba(255, 94, 98, 0.7);
    }
  </style>
</head>

<body>
  <div class="main">
    <div class="box">
      <img src="https://images.unsplash.com/photo-1743178726215-b0c7f4ec94e5?q=80&w=687&auto=format&fit=crop" alt="">
      <div class="bottom">
        <h3>Peanut Butter</h3>
      </div>
    </div>

    <div class="box">
      <img src="https://images.unsplash.com/photo-1632837929035-1ca41310be61?q=80&w=764&auto=format&fit=crop" alt="">
      <div class="bottom"><h3>Chocolate Smoothie</h3></div>
    </div>

    <div class="box">
      <img src="https://plus.unsplash.com/premium_photo-1666253246996-48ebd0922129?w=600&auto=format&fit=crop&q=60" alt="">
      <div class="bottom"><h3>Almond Treat</h3></div>
    </div>

    <div class="box">
      <img src="https://images.unsplash.com/photo-1652487343800-de99be6a2b3a?w=600&auto=format&fit=crop&q=60" alt="">
      <div class="bottom"><h3>Hazelnut Cream</h3></div>
    </div>

    <div class="box">
      <img src="https://images.unsplash.com/photo-1693897033368-6befa0e22c81?w=600&auto=format&fit=crop&q=60" alt="">
      <div class="bottom"><h3>Strawberry Shake</h3></div>
    </div>

    <div class="box">
      <img src="https://images.unsplash.com/photo-1652284918105-94bffe66a827?w=600&auto=format&fit=crop&q=60" alt="">
      <div class="bottom"><h3>Oats Delight</h3></div>
    </div>

    <div class="box">
      <img src="https://images.unsplash.com/photo-1644004484802-c313152f5d8f?w=600&auto=format&fit=crop&q=60" alt="">
      <div class="bottom"><h3>Honey Almond</h3></div>
    </div>

    <div class="box">
      <img src="https://images.unsplash.com/photo-1631144800729-95f107062c43?w=600&auto=format&fit=crop&q=60" alt="">
      <div class="bottom"><h3>Cashew Crunch</h3></div>
    </div>
  </div>
</body>
</html>
