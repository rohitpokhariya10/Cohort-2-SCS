<!DOCTYPE html>

    <style>
        * {

        #main {

        }

        #center {

            font-weight: 650;

        }

        #nav1,

            gap: 10px;
        }


        #main>h1 {

            padding: 55px;

        }

        }

        }

        #btm-left h4 {

        }

        #img3 {

            align-items: center;
            position: absolute;
            bottom: 2%;
            padding-left: 55px;
            padding-bottom: 10px;

        #footer h3 {
            font-size: 20px;
        }

        #footer a {
            text-decoration: none;
            padding-right: 25px;
            color: #000;
            font-size: 18px;

        }
    </style>
</head>
